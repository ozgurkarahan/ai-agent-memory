      <path d="M0,14 a14,14 0 0 1 14,-14 h236 a14,14 0 0 1 14,14 v40 a14,14 0 0 1 -14,14 h-210 l-14,16 l-2,-16 h-24 a14,14 0 0 1 -14,-14 z" fill="#FFF7EE" stroke="#E8C7B5" stroke-width="1.4"/>
