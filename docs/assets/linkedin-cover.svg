      <text x="20" y="50" font-size="13" fill="#2A1A14" font-weight="600">"Using utf-8 encoding to avoid</text>
      <text x="20" y="66" font-size="13" fill="#2A1A14" font-weight="600">the Windows subprocess bug"</text>
    </g>
    <g transform="translate(860,446)" filter="url(#soft-shadow)">
