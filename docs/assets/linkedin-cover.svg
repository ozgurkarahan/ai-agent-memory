<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4E8"/>
      <stop offset="55%" stop-color="#FDE8DC"/>
      <stop offset="100%" stop-color="#F8E0D6"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB59A"/>
      <stop offset="55%" stop-color="#FF8A73"/>
      <stop offset="100%" stop-color="#E86A5A"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFC7A6" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#FFB59A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFB59A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-ingest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE3C9"/>
      <stop offset="100%" stop-color="#FFD0A8"/>
    </linearGradient>
    <linearGradient id="g-end" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FCD9E5"/>
      <stop offset="100%" stop-color="#F6B8D1"/>
    </linearGradient>
    <linearGradient id="g-query" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF0C9"/>
      <stop offset="100%" stop-color="#FFE08A"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" in="SourceAlpha"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="627" fill="url(#bg)"/>

  <g opacity="0.45">
    <circle cx="1140" cy="70" r="140" fill="#FFE0C7"/>
    <circle cx="60" cy="540" r="150" fill="#FFD9CC"/>
    <circle cx="1100" cy="580" r="110" fill="#FCE2D0"/>
  </g>

  <text x="600" y="72" text-anchor="middle" fill="#2A1A14" font-size="40" font-weight="800" letter-spacing="-0.6">A Living Memory for Every AI Coding Agent</text>
  <text x="600" y="104" text-anchor="middle" fill="#7A5A4A" font-size="17" font-weight="500" letter-spacing="0.3">One wiki that learns every session, feeds every agent, powers every project</text>

  <!-- LEFT inputs -->
  <g>
    <g transform="translate(70,155)" filter="url(#soft-shadow)">
      <rect width="88" height="66" rx="12" fill="#ffffff" stroke="#E8C7B5" stroke-width="1.2"/>
